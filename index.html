<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水厂药剂计算系统平台</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b5cff" />

  <style>
    :root {
      --primary: #0b5cff;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--text-main);
    }

    header {
      background: linear-gradient(135deg, #0b5cff, #3b82f6);
      color: #fff;
      padding: 18px 16px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 1px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
    }

    .intro {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 16px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 18px 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      padding: 18px 0 28px;
    }
  </style>
</head>

<body>
  <header>水厂药剂计算系统平台</header>

  <div class="container">
    <div class="intro">
      统一入口 · 工程计算 · 现场稳定运行
    </div>

    <div class="grid">
      <div class="card" onclick="go('sys1.html')">
        <div class="card-title">加药加氯计算系统</div>
        <div class="card-desc">
          用于水厂日常加药、加氯投加量计算，支持快速核算与现场使用。
        </div>
      </div>

      <div class="card" onclick="go('sys2.html')">
        <div class="card-title">一期 / 二期混助配药系统</div>
        <div class="card-desc">
          支持一期、二期混助药剂配制计算，减少人工误差，提高计算可靠性。
        </div>
      </div>

      <div class="card" onclick="go('sys3.html')">
        <div class="card-title">药剂消耗核算系统</div>
        <div class="card-desc">
          对药剂消耗进行统计与核算，辅助运行分析与管理决策。
        </div>
      </div>
    </div>
  </div>

  <footer>
    © 水厂运行计算平台 · 内部工程系统
  </footer>

  <script>
    function go(page) {
      window.location.href = page;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
